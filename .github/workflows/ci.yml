name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: No word runs into a tag
        run: pnpm check:spacing

      - name: The markdown twins are real
        # Generated from the built HTML, so they cannot drift from the pages.
        # What they can do is come out empty if the conversion breaks, and an
        # empty twin tells a reader the page says almost nothing. Derived from
        # what was built rather than from a list of page names, because a list
        # here would pass while a whole new section shipped with no twin at all.
        run: |
          bad=0
          for page in $(find dist -name '*.html' ! -name '404.html' | sort); do
            file="${page%.html}.md"
            if [ ! -f "$file" ]; then
              echo "$page has no twin at $file." >&2
              bad=1
              continue
            fi
            if [ "$(wc -c < "$file")" -lt 1000 ]; then
              echo "$file is too small to be the page it claims to be." >&2
              bad=1
            fi
            if grep -qE '</[a-z]+>' "$file"; then
              echo "$file still carries HTML tags, so the conversion is wrong:" >&2
              grep -nE '</[a-z]+>' "$file" | head -3 >&2
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "Every built page has a twin, and every twin is readable."

      - name: No client JavaScript ships
        # The site's Content-Security-Policy says script-src 'none'. If a build
        # ever emits a script this fails here rather than in a browser console
        # on a page that has already shipped.
        #
        # One exception, and only one: a `type="application/ld+json"` block is a
        # data block that never executes, so script-src has nothing to act on.
        # It is allowed, and each one is parsed here to prove it really is data
        # rather than something wearing the type attribute.
        run: |
          if find dist -name '*.js' -o -name '*.mjs' | grep -q .; then
            echo "A JavaScript file was emitted, which the CSP forbids:" >&2
            find dist -name '*.js' -o -name '*.mjs' >&2
            exit 1
          fi
          python3 - <<'CHECK'
          import json
          import re
          import sys
          from pathlib import Path

          LD = re.compile(
              r'<script[^>]*\btype=["\']application/ld\+json["\'][^>]*>(.*?)</script>',
              re.S | re.I,
          )
          problems = []
          for page in sorted(Path("dist").rglob("*.html")):
              html = page.read_text(encoding="utf-8")
              for block in LD.findall(html):
                  try:
                      json.loads(block)
                  except json.JSONDecodeError as bad:
                      problems.append(f"{page}: the JSON-LD block does not parse: {bad}")
              if "<script" in LD.sub("", html):
                  problems.append(f"{page}: a script tag that is not JSON-LD")
          if problems:
              print("The CSP forbids this:", *problems, sep="\n  ", file=sys.stderr)
              sys.exit(1)
          CHECK
          echo "No client JavaScript, as the header promises."
